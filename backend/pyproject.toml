[project]
name = "backend"
version = "0.2.0"
description = "Local-First AI-Powered DAM & Streaming Hub"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "mutagen>=1.48.1",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "smbprotocol>=1.17.0",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
